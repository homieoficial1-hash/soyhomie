<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NQ PROJECT</title>
<style>
  :root{
    --bg:#000;--ink:#fff;--muted:#8a8a8a;--line:rgba(255,255,255,.22);
    --hero-h:46dvh;--pad:24px;--font:"Helvetica Neue", Helvetica, Arial, sans-serif;--kick:#53FC18;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}

  .app{position:relative;min-height:100dvh;width:100%;max-width:480px;margin:0 auto;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;animation:appIn .7s ease both}
  @keyframes appIn{from{opacity:0}to{opacity:1}}

  .fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .hero{position:relative;z-index:1;flex:0 0 var(--hero-h);overflow:hidden;background:#f3f3f3}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:50% 2%;display:block;filter:grayscale(100%) contrast(1.03)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:55%;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 50%, #000 100%);pointer-events:none}

  .content{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;
    padding:18px var(--pad) calc(26px + env(safe-area-inset-bottom))}
  .content>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .head{text-align:center;animation-delay:.12s}
  .head h1{font-weight:600;font-size:24px;letter-spacing:.16em;text-transform:uppercase;
    animation:titleIn 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:.25s}
  @keyframes titleIn{
    0%{opacity:0;letter-spacing:.6em;filter:blur(8px)}
    60%{opacity:1;filter:blur(0)}
    100%{opacity:1;letter-spacing:.16em;filter:blur(0)}
  }

  /* ===== LISTA CON FOCO / DESENFOQUE ===== */
  .focus{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:22px;width:100%;animation-delay:.24s}
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}

  .opt{position:relative;display:flex;align-items:center;text-decoration:none;color:#fff;transform-origin:center;max-width:100%;
    border:1px solid var(--line);background:transparent;border-radius:13px;padding:11px 15px;
    transition:transform .4s cubic-bezier(.2,.7,.2,1), border-color .35s ease, background .35s ease, box-shadow .35s ease}
  .opt.active{transform:scale(1.045);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  @media(hover:hover){.opt:hover{border-color:rgba(255,255,255,.5)}}

  /* contorno de luz que recorre el borde (solo el botón activo) */
  .opt.active::after{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.7px;pointer-events:none;
    background:conic-gradient(from var(--ang),
      rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 245deg,
      rgba(255,255,255,.12) 300deg, rgba(255,255,255,.85) 345deg, #ffffff 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.75));
    animation:travel 2.6s linear infinite;
  }
  @keyframes travel{to{--ang:360deg}}

  /* mentoría destacada */
  .opt.feat{border-color:rgba(255,255,255,.3)}
  .opt.feat .t{font-size:clamp(20px,5.2vw,24px)}
  /* mientras espera su turno, su contorno se intensifica poco a poco */
  .opt.feat:not(.active){animation:charge 6s ease-in forwards}
  @keyframes charge{
    0%{border-color:rgba(255,255,255,.25);box-shadow:0 0 0 0 rgba(255,255,255,0)}
    60%{border-color:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 0 20px rgba(255,255,255,.25)}
    100%{border-color:#ffffff;box-shadow:0 0 0 1.5px rgba(255,255,255,.85), 0 0 40px rgba(255,255,255,.48)}
  }

  .opt .ar{flex:0 0 auto;width:0;opacity:0;overflow:hidden;display:inline-flex;align-items:center;
    transition:width .45s cubic-bezier(.2,.7,.2,1), opacity .4s ease}
  .opt .ar svg{width:26px;height:26px}
  .opt .logo{flex:0 0 auto;width:34px;height:34px;border-radius:9px;overflow:hidden;margin-right:13px;display:inline-flex;border:1px solid var(--line)}
  .opt .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .opt.active .ar{width:38px;opacity:1}

  .opt .body{display:flex;flex-direction:column;gap:3px;min-width:0}
  .opt .t{font-weight:500;font-size:clamp(18px,4.8vw,22px);letter-spacing:-.01em;line-height:1.12;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;transition:font-weight .2s}
  .opt.active .t{font-weight:700}
  .opt .s{font-weight:300;font-size:12px;color:var(--muted);line-height:1.2}

  .free{font-size:11px;font-weight:600;color:#fff;border:1px solid var(--line);padding:2px 8px;border-radius:100px;letter-spacing:.02em}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--kick);font-weight:700}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--kick);box-shadow:0 0 8px var(--kick);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  /* YouTube: pill "En vivo" en rojo */
  #b-youtube .live{color:#FF2D2D}
  #b-youtube .live i{background:#FF2D2D;box-shadow:0 0 8px #FF2D2D}

  .foot{margin-top:auto;padding-top:24px;text-align:center;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#5a5a5a;font-weight:600;animation-delay:.6s}

  @media (max-height:700px){:root{--hero-h:40dvh}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.05ms !important}
  }
</style>
</head>

<script>

const LINKS = {
  mentoria:  "Mentoria.html",
  comunidad: "https://chat.whatsapp.com/GWaMz51Tou59ePBaPV6dE7",
  youtube:   "https://www.youtube.com/@SoyHomie.oficial",
  apex:      "https://apextraderfunding.com/member/aff/go/alexvar",
  alpha:     "https://app.alpha-futures.com/signup/HOMIE/"
};

Object.entries(LINKS).forEach(([k,v])=>{
  const el = document.getElementById('b-'+k);
  if(!el) return;
  if(v.indexOf('PEGA')===0){
    el.setAttribute('href','#');
    el.addEventListener('click', e=>e.preventDefault());
  } else {
    el.setAttribute('href', v);
    if(k!=='mentoria'){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener'); }
  }
});

/* ===== FOCO QUE RECORRE LAS OPCIONES ===== */
(function(){
  const opts = Array.from(document.querySelectorAll('.opt'));
  if(!opts.length) return;
  let idx = 0, paused = false, resumeT = null;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setActive(i){ idx=i; opts.forEach((o,j)=>o.classList.toggle('active', j===i)); }
  setActive(0);
  if(reduce){ return; }
  setInterval(()=>{ if(!paused) setActive((idx+1)%opts.length); }, 2000);
  function resumeSoon(){ clearTimeout(resumeT); resumeT=setTimeout(()=>{paused=false;}, 3000); }
  opts.forEach((o,i)=>{
    o.addEventListener('pointerenter',()=>{ paused=true; setActive(i); });
    o.addEventListener('pointerdown',()=>{ paused=true; setActive(i); });
    o.addEventListener('pointerleave', resumeSoon);
    o.addEventListener('pointerup', resumeSoon);
  });
})();

/* ===== PARTÍCULAS AMBIENTALES ===== */
(function(){
  const c = document.getElementById('fx');
  if(!c) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = c.getContext('2d');
  let w=0,h=0,dpr=1,parts=[];
  function size(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    const r = c.getBoundingClientRect();
    w=r.width; h=r.height; c.width=w*dpr; c.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function init(){
    const n = Math.max(55, Math.min(110, Math.round(w*h/5200)));
    parts = Array.from({length:n}, ()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+.5,
      vy:-(Math.random()*.16+.04), vx:(Math.random()-.5)*.10,
      a:Math.random()*.32+.08, tw:Math.random()*Math.PI*2
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    for(const p of parts){
      p.y+=p.vy; p.x+=p.vx; p.tw+=0.018;
      if(p.y<-6){p.y=h+6;p.x=Math.random()*w;}
      if(p.x<-6)p.x=w+6; if(p.x>w+6)p.x=-6;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle='rgba(255,255,255,'+(p.a*(0.6+0.4*Math.sin(p.tw)))+')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  size(); init();
  window.addEventListener('resize', ()=>{ size(); init(); });
  requestAnimationFrame(tick);
})();
</script>
